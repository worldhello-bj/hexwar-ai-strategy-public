name: Offline contract tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install neural baseline dependency
        run: python -m pip install -r requirements-neural.txt
      - name: Unit contracts (synthetic fixtures only)
        run: python -m unittest discover -s tests -v
      - name: Existing rule regression
        run: python tools/verify_rules.py
      - name: Existing table consistency
        run: python tools/verify_tables.py
      # ↓ 把「检查」交给机器跑，而不是相信谁（含 AI）自觉：
      #   ① 初设数据不变式（开局无人在车内 / 36 单位 / 位置合法 / 离线桩对账）
      #   ② 训练入口的规则门（公开克隆布局 = 直接用仓库根的核心，不依赖 train/ 生成副本）
      #   ③ 真跑一局：证明"能训练"不是空话（缺 env/scenario 会在这里红）
      - name: 比赛初设数据核对
        run: python tools/verify_scenario_units.py
      - name: 训练环境门禁（rules gate）
        run: python train/run_train.py rules
      - name: 训练环境冒烟（真实想定跑 3 局）
        run: python train/run_train.py mc --config train/configs/smoke_realmap.json
